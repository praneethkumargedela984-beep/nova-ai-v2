
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta name="theme-color" content="#09090c">
        <title>NOVA AI | Command Center</title>
          <style>
              * { box-sizing: border-box; }
                  body {
                        margin: 0;
                              min-height: 100vh;
                                    background: #09090c;
                                          color: #f5f5f7;
                                                font-family: system-ui, sans-serif;
                                                      display: grid;
                                                            place-items: center;
                                                                  padding: 20px;
                                                                      }
                                                                          main {
                                                                                width: min(100%, 720px);
                                                                                      text-align: center;
                                                                                            border: 1px solid #49202a;
                                                                                                  border-radius: 22px;
                                                                                                        padding: 28px;
                                                                                                              background: linear-gradient(145deg, #171116, #0b0b10 65%);
                                                                                                                    box-shadow: 0 0 45px #b516301c;
                                                                                                                        }
                                                                                                                            .status {
                                                                                                                                  color: #ff536b;
                                                                                                                                        font-size: 12px;
                                                                                                                                              letter-spacing: 3px;
                                                                                                                                                  }
                                                                                                                                                      .reactor {
                                                                                                                                                            width: 116px;
                                                                                                                                                                  height: 116px;
                                                                                                                                                                        margin: 28px auto;
                                                                                                                                                                              border: 2px solid #ff3657;
                                                                                                                                                                                    border-radius: 50%;
                                                                                                                                                                                          display: grid;
                                                                                                                                                                                                place-items: center;
                                                                                                                                                                                                      box-shadow: 0 0 22px #ff244755, inset 0 0 22px #ff244722;
                                                                                                                                                                                                            animation: pulse 2.5s ease-in-out infinite;
                                                                                                                                                                                                                }
                                                                                                                                                                                                                    .reactor span {
                                                                                                                                                                                                                          font-size: 34px;
                                                                                                                                                                                                                                font-weight: 800;
                                                                                                                                                                                                                                      color: #ff536b;
                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                              @keyframes pulse {
                                                                                                                                                                                                                                                    50% { box-shadow: 0 0 38px #ff244788, inset 0 0 28px #ff244744; }
                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                            h1 { letter-spacing: 7px; margin-bottom: 8px; }
                                                                                                                                                                                                                                                                .subtitle { color: #aaa3ad; }
                                                                                                                                                                                                                                                                    #messages {
                                                                                                                                                                                                                                                                          margin-top: 26px;
                                                                                                                                                                                                                                                                                padding: 16px;
                                                                                                                                                                                                                                                                                      min-height: 90px;
                                                                                                                                                                                                                                                                                            text-align: left;
                                                                                                                                                                                                                                                                                                  border-radius: 12px;
                                                                                                                                                                                                                                                                                                        background: #08080b;
                                                                                                                                                                                                                                                                                                              border: 1px solid #30232b;
                                                                                                                                                                                                                                                                                                                    white-space: pre-wrap;
                                                                                                                                                                                                                                                                                                                          overflow-wrap: anywhere;
                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                  label { display: block; text-align: left; margin: 20px 0 8px; }
                                                                                                                                                                                                                                                                                                                                      .composer { display: flex; gap: 8px; }
                                                                                                                                                                                                                                                                                                                                          input {
                                                                                                                                                                                                                                                                                                                                                min-width: 0;
                                                                                                                                                                                                                                                                                                                                                      flex: 1;
                                                                                                                                                                                                                                                                                                                                                            padding: 14px;
                                                                                                                                                                                                                                                                                                                                                                  border-radius: 10px;
                                                                                                                                                                                                                                                                                                                                                                        border: 1px solid #49303a;
                                                                                                                                                                                                                                                                                                                                                                              background: #111015;
                                                                                                                                                                                                                                                                                                                                                                                    color: white;
                                                                                                                                                                                                                                                                                                                                                                                          font-size: 16px;
                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                  button {
                                                                                                                                                                                                                                                                                                                                                                                                        padding: 12px 18px;
                                                                                                                                                                                                                                                                                                                                                                                                              border: 0;
                                                                                                                                                                                                                                                                                                                                                                                                                    border-radius: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                          background: #d92548;
                                                                                                                                                                                                                                                                                                                                                                                                                                color: white;
                                                                                                                                                                                                                                                                                                                                                                                                                                      font-weight: 700;
                                                                                                                                                                                                                                                                                                                                                                                                                                            cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                    button:focus-visible, input:focus-visible {
                                                                                                                                                                                                                                                                                                                                                                                                                                                          outline: 2px solid #ff8092;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                outline-offset: 3px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        #note { color: #b6aab1; font-size: 12px; margin-top: 18px; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            @media (max-width: 480px) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  main { padding: 20px 14px; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .composer { flex-direction: column; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              button { min-height: 46px; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      @media (prefers-reduced-motion: reduce) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .reactor { animation: none; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <main>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="status">● SYSTEM ONLINE — INTERFACE TEST</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="reactor" aria-hidden="true"><span>N</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <h1>NOVA</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p class="subtitle">Your personal command center</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div id="messages" role="status" aria-live="polite">NOVA interface loaded. Send a test message below.</div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <form id="chat-form">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <label for="message">Test the interface</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="composer">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input id="message" maxlength="500" placeholder="Type a test message..." autocomplete="off" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button type="submit">Send</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </form>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <p id="note">UI TEST ONLY · AI BACKEND NOT CONNECTED</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const form = document.getElementById("chat-form");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const input = document.getElementById("message");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const messages = document.getElementById("messages");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          form.addEventListener("submit", function (event) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                event.preventDefault();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const text = input.value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (!text) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    messages.textContent = "Please enter a test message.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        messages.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "Your message reached the NOVA interface:\n" + text +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "\n\nThis is a local UI test. The real AI is not connected yet.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              input.value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
